name: Build Angular portfolio for GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "angular.json"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/build-portfolio-pages.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: portfolio-pages-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Angular site
        run: npm run build -- --output-path docs --base-href /

      - name: Publish generated site files to docs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs
          if git diff --cached --quiet; then
            echo "No generated site changes."
          else
            git commit -m "build: refresh GitHub Pages site"
            git push
          fi
